{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h3 class="fw-bold text-primary mb-3">Confirm Appointment</h3>
            <p class="text-muted">Booking consultation with <strong>Dr. {{ doctor.name }}</strong> (Fee: ৳{{ doctor.consultation_fee }})</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Preferred Date</label>
                    <input type="date" name="appointment_date" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Time Slot</label>
                    <select name="time_slot" class="form-select" required>
                        <option value="5:00 PM - 5:30 PM">5:00 PM - 5:30 PM</option>
                        <option value="5:30 PM - 6:00 PM">5:30 PM - 6:00 PM</option>
                        <option value="6:00 PM - 6:30 PM">6:00 PM - 6:30 PM</option>
                        <option value="7:00 PM - 7:30 PM">7:00 PM - 7:30 PM</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Confirm & Pay at Chamber</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
