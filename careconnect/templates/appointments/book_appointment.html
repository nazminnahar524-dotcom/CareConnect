{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white">
                <div class="bg-teal py-2"></div>
                <div class="card-body p-4 p-md-5">
                    <h3 class="fw-bold text-dark mb-2">Confirm Appointment</h3>
                    <p class="text-muted small mb-4">Booking consultation with <strong class="text-teal">Dr. {{ doctor.name }}</strong> (Fee: <span class="text-teal fw-bold">৳{{ doctor.consultation_fee }}</span>)</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">Preferred Date</label>
                            <input type="date" name="appointment_date" class="form-control rounded-pill px-3 shadow-sm" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary">Time Slot</label>
                            <select name="time_slot" class="form-select rounded-pill px-3 shadow-sm" required>
                                <option value="5:00 PM - 5:30 PM">5:00 PM - 5:30 PM</option>
                                <option value="5:30 PM - 6:00 PM">5:30 PM - 6:00 PM</option>
                                <option value="6:00 PM - 6:30 PM">6:00 PM - 6:30 PM</option>
                                <option value="7:00 PM - 7:30 PM">7:00 PM - 7:30 PM</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-teal w-100 py-2 rounded-pill shadow-sm fw-semibold">
                            <i class="fas fa-check-circle me-1"></i> Confirm & Pay at Chamber
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
