<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'doctor_list' %}">🩺 DocBooking</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'doctor_list' %}">Find Doctors</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'my_appointments' %}">My Appointments</a>
                    <span class="nav-link text-warning fw-bold">Hi, {{ user.username }}</span>
                    <a class="nav-link btn btn-outline-light btn-sm text-dark px-2 ms-2" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="nav-link btn btn-light text-primary btn-sm px-3 ms-2" href="{% url 'login' %}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container my-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
