<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Doctor Appointment System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --medical-teal: #0d9488;
            --medical-teal-dark: #0f766e;
            --medical-light: #f0fdfa;
        }
        .bg-teal {
            background-color: var(--medical-teal) !important;
        }
        .text-teal {
            color: var(--medical-teal) !important;
        }
        .btn-teal {
            background-color: var(--medical-teal);
            color: white;
        }
        .btn-teal:hover {
            background-color: var(--medical-teal-dark);
            color: white;
        }
        .border-teal {
            border-color: var(--medical-teal) !important;
        }
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-teal shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'doctor_list' %}">
                <i class="fas fa-stethoscope me-2"></i>CareConnect
            </a>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white me-3 small">Hi, <strong>{{ user.username }}</strong></span>
                    <a href="{% url 'my_appointments' %}" class="btn btn-outline-light btn-sm me-2 rounded-pill px-3">My Appointments</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-light btn-sm text-teal fw-bold rounded-pill px-3">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-light btn-sm px-4 fw-bold text-teal rounded-pill">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show shadow-sm border-0 bg-teal text-white" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
